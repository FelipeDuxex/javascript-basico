name: Executavel

# O PyInstaller nao faz cross-compile: para sair um .exe de Windows, o build
# precisa rodar no Windows. Por isso o executavel sai daqui, e nao da maquina
# de desenvolvimento.
on:
  workflow_dispatch:        # botao "Run workflow" na aba Actions
    inputs:
      versao:
        description: >-
          Versao para publicar como Release (ex: v1.0.0). Deixe vazio para so
          gerar o artefato, sem publicar.
        required: false
        default: ""
  push:
    tags: ["v*"]            # uma tag v1.0.0 tambem publica uma release
  pull_request:
    paths:                  # so quando o empacotamento em si muda
      - "build_exe.py"
      - "TimelineSync.py"
      - "build/**"
      - ".github/workflows/build-exe.yml"
      - "timeline_sync/runtime.py"
      - "timeline_sync/launcher.py"

permissions:
  contents: write           # necessario para anexar os binarios a release

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    # O build leva ~2 min. O teto existe para um travamento nao consumir as 6h
    # padrao do runner antes de alguem perceber.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tzdata

      - name: Instalar ffmpeg (so para gerar o material de teste)
        run: choco install ffmpeg -y --no-progress
        continue-on-error: true

      - name: Gerar material de teste
        # Sem material, o build_exe.py ainda empacota e verifica o executavel,
        # mas pula o teste de organizar de verdade. Com material, a verificacao
        # cobre o caminho completo: ler metadado, agrupar e exportar XML.
        run: python gerar_testes.py --cenario 2 --escala 0.4
        continue-on-error: true

      - name: Empacotar e verificar
        run: python build_exe.py

      - name: Conferir o que saiu
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist | Where-Object { -not $_.PSIsContainer } |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: TimelineSync-windows
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/onefile/TimelineSync.exe
            dist/TimelineSync-windows-pasta.zip

      - name: Onde estao os arquivos
        shell: bash
        run: |
          {
            echo "## Executavel pronto"
            echo
            echo "Baixe o artefato **TimelineSync-windows** no final desta pagina."
            echo "O GitHub entrega artefatos sempre dentro de um \`.zip\`; dentro dele:"
            echo
            echo "| Arquivo | O que e |"
            echo "|---|---|"
            echo "| \`TimelineSync.exe\` | arquivo unico — clique duas vezes |"
            echo "| \`TimelineSync-windows-pasta.zip\` | versao em pasta, plano B para antivirus |"
            echo
            echo "Para um link permanente e publico, rode este workflow pelo botao"
            echo "**Run workflow** preenchendo o campo \`versao\` (ex: \`v1.0.0\`) —"
            echo "ele publica uma Release com os binarios anexados."
          } >> "$GITHUB_STEP_SUMMARY"

      # Publica a Release quando vier de uma tag `v*` OU quando o workflow for
      # disparado a mao com o campo `versao` preenchido. O segundo caminho existe
      # porque artefato de Actions expira, exige login e vem dentro de um zip —
      # uma Release da um link direto e permanente, que e onde as pessoas
      # realmente procuram um download.
      - name: Publicar Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.versao != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: >-
            ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.versao }}
          name: >-
            Timeline Sync ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.versao }}
          files: |
            dist/onefile/TimelineSync.exe
            dist/TimelineSync-windows-pasta.zip
          body: |
            ## Timeline Sync — executavel para Windows

            **`TimelineSync.exe`** — arquivo unico. Baixe e clique duas vezes;
            a interface abre no navegador em `http://127.0.0.1:8730`.

            **`TimelineSync-windows-pasta.zip`** — a mesma coisa em formato de
            pasta. Inicia mais rapido e da menos atrito com antivirus. Use se o
            arquivo unico travar.

            ### Na primeira vez o Windows vai reclamar

            O executavel nao e assinado digitalmente (certificado custa caro e
            isto e um app pessoal). O SmartScreen mostra "Windows protegeu o seu
            computador" → **Mais informacoes** → **Executar assim mesmo**.

            ### ffmpeg e opcional

            O app le MP4, MOV e WAV com parser proprio e nao precisa de ffmpeg
            para organizar e exportar. Ele so e necessario para o refino de sync
            por audio. Para habilitar, coloque `ffmpeg.exe` e `ffprobe.exe` na
            mesma pasta do `TimelineSync.exe`.

  # Confere que o empacotamento tambem funciona fora do Windows. Nao produz
  # entregavel — serve para o build nao quebrar so num sistema.
  linux:
    name: Linux (verificacao)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tzdata
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python gerar_testes.py --cenario 2 --escala 0.4
      - run: python build_exe.py --modo onefile
